# Cloudflare Worker that relays the coach <-> rower link (see relay/src/index.js
# and src/hooks/useRelayLink.js). Free plan is enough: Durable Objects must be
# SQLite-backed there, hence new_sqlite_classes.
#
#   npm run relay:dev      # local copy on http://127.0.0.1:8787 (Vite spawns this for you)
#   npm run relay:deploy   # publish to https://free-speed-relay.<your-subdomain>.workers.dev
name = "free-speed-relay"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
